apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-api
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-api
  template:
    metadata:
      labels:
        app: vulnerable-api
    spec:
      containers:
        - name: api
          image: myorg/vulnerable-api:latest
          ports:
            - containerPort: 8080
          # Missing resources block
---
# Missing NetworkPolicy resources in production namespace
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-api
  namespace: production
spec:
  selector:
    app: vulnerable-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
