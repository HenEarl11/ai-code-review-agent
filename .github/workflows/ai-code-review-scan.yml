name: AI Code Review - Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ secrets.AICR_BACKEND_URL || 'http://localhost:5001' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker (for optional local backend)
        uses: docker/setup-buildx-action@v2

      - name: Optionally start local backend in Docker (if AICR_BACKEND_IMAGE provided)
        run: |
          if [ -n "${{ secrets.AICR_BACKEND_IMAGE }}" ]; then
            echo "Starting backend image from secrets.AICR_BACKEND_IMAGE"
            docker run -d --name ai-review-backend -p 5001:5000 -e AICR_OLLAMA_URL="${{ secrets.AICR_OLLAMA_URL }}" -e AICR_OLLAMA_MODEL="${{ secrets.AICR_OLLAMA_MODEL }}" ${{ secrets.AICR_BACKEND_IMAGE }} || true
          else
            echo "No AICR_BACKEND_IMAGE secret defined; assume BACKEND_URL is reachable"
          fi

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -sSf "$BACKEND_URL/api/health" >/dev/null 2>&1; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Make script executable
        run: chmod +x scripts/scan_repo.sh

      - name: Run scan (current checkout)
        run: ./scripts/scan_repo.sh . main "$BACKEND_URL"

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: ai-code-review-scan-results
          path: scan_results/**
