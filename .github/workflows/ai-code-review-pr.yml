name: AI Code Review - PR Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-scan:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: http://localhost:5001
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Ensure scan script is executable
        run: chmod +x scripts/scan_repo.sh

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Start backend container (optional image)
        run: |
          if [ -n "${{ secrets.AICR_BACKEND_IMAGE }}" ]; then
            echo "Starting backend image from AICR_BACKEND_IMAGE"
            docker run -d --name ai-review-backend -p 5001:5000 -e AICR_OLLAMA_URL="${{ secrets.AICR_OLLAMA_URL }}" -e AICR_OLLAMA_MODEL="${{ secrets.AICR_OLLAMA_MODEL }}" ${{ secrets.AICR_BACKEND_IMAGE }} || true
          else
            echo "No AICR_BACKEND_IMAGE secret provided; attempting to build local backend image from ./backend"
            docker build -t ai-review-backend ./backend
            docker run -d --name ai-review-backend -p 5001:5000 ai-review-backend || true
          fi

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -sSf "$BACKEND_URL/api/health" >/dev/null 2>&1; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to start" && exit 1

      - name: Run scan (current checkout)
        run: ./scripts/scan_repo.sh . "$GITHUB_HEAD_REF" "$BACKEND_URL"

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: ai-code-review-scan-results
          path: scan_results/**

      - name: Post PR comment with summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'scan_results/summary.json';
            let body = 'AI Code Review results could not be found.';
            if (fs.existsSync(path)) {
              const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
              body = `### AI Code Review Summary\n` +
                     `- Files scanned: ${summary.files}\n` +
                     `- Total issues: ${summary.total_issues}\n` +
                     `- By severity: \n` + Object.entries(summary.by_severity || {}).map(([k,v]) => `  - ${k}: ${v}`).join('\n') + '\n' +
                     `- By type: \n` + Object.entries(summary.by_type || {}).map(([k,v]) => `  - ${k}: ${v}`).join('\n') + '\n\n' +
                     `You can download full results from the workflow artifacts (attached).`;
            }
            const pr = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body
            });

      - name: Stop backend container
        if: always()
        run: |
          docker rm -f ai-review-backend || true
