version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-review-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=True
      - FLASK_PORT=5000
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=mistral
      - JIRA_HOST=http://jira:8080
      - JIRA_USERNAME=admin
      - JIRA_API_TOKEN=ATATT3xFfGF0v-example
      - JIRA_PROJECT_KEY=AICR
      - DATABASE_URL=sqlite:///./db/ai_review.db
      - MAX_FILE_SIZE=1000000
      - ANALYSIS_TIMEOUT=30
      - CACHE_ENABLED=True
    volumes:
      - ./backend:/app
      - ./db:/app/db
    depends_on:
      - ollama
      - jira
    networks:
      - ai-review-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama LLM Service (Local LLM Inference)
  ollama:
    image: ollama/ollama:latest
    container_name: ai-review-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ai-review-network
    environment:
      - OLLAMA_NUM_THREAD=4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Note: Pull model on startup
    # Command: ollama pull mistral

  # Jira Software (Code Review Issue Tracking)
  jira:
    image: atlassian/jira-software:9.13.0
    container_name: ai-review-jira
    ports:
      - "8080:8080"
    environment:
      # JVM Memory settings
      - JVM_MINIMUM_MEMORY=512m
      - JVM_MAXIMUM_MEMORY=1024m
      # Database (using H2 for local development)
      - ATL_DB_TYPE=h2
      - ATL_DB_DRIVER=org.h2.Driver
      - ATL_DB_URL=jdbc:h2:/var/atlassian/application-data/jira/database
      - ATL_DB_USER=sa
      - ATL_DB_PASS=
    volumes:
      - jira-data:/var/atlassian/application-data/jira
    networks:
      - ai-review-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # PostgreSQL Database (Optional - can replace H2)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: ai-review-postgres
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     - POSTGRES_USER=jira
  #     - POSTGRES_PASSWORD=jirapass
  #     - POSTGRES_DB=jiradb
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - ai-review-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U jira"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  ollama-data:
    driver: local
  jira-data:
    driver: local
  # postgres-data:
  #   driver: local
  db:
    driver: local

networks:
  ai-review-network:
    driver: bridge
